[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "telecom-gateway"
version = "0.2.0"
description = "Python CLI and Agent Skill for supported China Telecom gateways"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
dependencies = ["keyring>=25,<27"]

[project.urls]
Repository = "https://github.com/zedoCN/telecom-gateway"

[project.scripts]
ctgw = "ctgw.cli:main"

[tool.setuptools]
packages = ["ctgw"]
package-dir = {"" = ".agents/skills/use-ctgw/scripts"}
