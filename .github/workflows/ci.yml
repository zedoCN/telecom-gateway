name: CI

on:
  push:
    branches: [main, 'codex/**']
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ['3.10', '3.13']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e .
      - run: python -m unittest discover -s tests -v
      - run: ctgw --json doctor
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - run: python -m pip install build
      - run: python -m build
      - run: python scripts/skill_bundle.py pack
      - name: Install wheel outside checkout
        run: |
          python -m venv /tmp/ctgw-check
          /tmp/ctgw-check/bin/pip install dist/*.whl
          cd /tmp
          /tmp/ctgw-check/bin/ctgw --json doctor
      - uses: actions/upload-artifact@v7
        with:
          name: telecom-gateway-packages
          path: dist/*
